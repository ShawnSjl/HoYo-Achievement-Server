databaseChangeLog:
  - changeSet:
      id: create_achievement
      author: ShawnSjl
      context: "dev,prod"
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: achievement
      changes:
        - createTable:
            tableName: achievement
            remarks: "游戏成就表"
            columns:
              - column:
                  name: game_id
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: achievement_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: reward_level
                  type: INT
                  defaultValueNumeric: '1'
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: INT
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
              - column:
                  name: game_version
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: achievement
            columnNames: game_id, achievement_id
            constraintName: pk_achievement_uuid
        - addForeignKeyConstraint:
            constraintName: fk_achievement_game
            baseTableName: achievement
            baseColumnNames: game_id
            referencedTableName: game_info
            referencedColumnNames: game_id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: achievement

  - changeSet:
      id: create_user_record
      author: ShawnSjl
      context: "dev,prod"
      preConditions:
        - tableExists:
            tableName: achievement
        - tableExists:
            tableName: account
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: user_record
      changes:
        - createTable:
            tableName: user_record
            columns:
              - column:
                  name: account_uuid
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: game_id
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: achievement_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: complete
                  type: INT
                  defaultValueNumeric: '0'
        - addPrimaryKey:
            tableName: user_record
            columnNames: account_uuid, game_id, achievement_id
            constraintName: pk_user_record
        - addForeignKeyConstraint:
            constraintName: fk_ur_account
            baseTableName: user_record
            baseColumnNames: account_uuid
            referencedTableName: account
            referencedColumnNames: account_uuid
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_ur_achievement
            baseTableName: user_record
            baseColumnNames: game_id, achievement_id
            referencedTableName: achievement
            referencedColumnNames: game_id, achievement_id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: user_record
